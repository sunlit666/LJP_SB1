<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9號展覽廳-日軍侵港(問答)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", SimHei, "PingFang TC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #222;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: #b82601;
            color: white;
            padding: 24px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .intro {
            padding: 24px;
            background: #fff8f8;
            border-bottom: 1px solid #eee;
        }
        .intro h3 {
            color: #b82601;
            margin-bottom: 10px;
        }

        /* 影片區域樣式 */
        .video-wrap {
            padding: 24px;
            background: #fef6f6;
            border-bottom: 1px solid #eee;
        }
        .video-wrap h3 {
            color: #b82601;
            margin-bottom: 12px;
        }
        .video-box {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom:16px;
        }
        .video-box video,
        .video-box iframe {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .quiz-box {
            padding: 30px;
        }
        .question-num {
            color: #666;
            margin-bottom: 12px;
        }
        .question-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .options-list {
            list-style: none;
        }
        .options-list li {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .options-list li:hover {
            border-color: #b82601;
            background: #fff2f2;
        }
        /* 答題狀態樣式 */
        .option-correct {
            background: #e6f9e6 !important;
            border-color: #009944 !important;
            color: #007733;
        }
        .option-wrong {
            background: #ffeaea !important;
            border-color: #dd3333 !important;
            color: #bb2222;
        }
        .tip-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .tip-correct {
            background: #e6f9e6;
            border:1px solid #009944;
        }
        .tip-wrong {
            background: #ffeaea;
            border:1px solid #dd3333;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 26px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #nextBtn {
            background: #b82601;
            color: white;
        }
        #nextBtn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #resetBtn {
            background: #444;
            color: white;
        }
        #resetBtn:hover {
            background: #222;
        }
        #nextBtn:not(:disabled):hover {
            background: #9e1f00;
        }
        .score-panel {
            margin-top: 20px;
            padding: 16px;
            background: #f0f4ff;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        @media(max-width:600px){
            header h1 {
                font-size: 22px;
            }
            .quiz-box, .video-wrap, .intro {
                padding: 16px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>9號展覽廳-日軍侵港(問答)</h1>
            <p>了解香港發展歷史，學習正確歷史知識（9號館主題）</p>
        </header>

        <div class="intro">
            <h3>📖 網站簡介</h3>
            <p>本問答題庫圍繞9號展廳相關展品與歷史內容設置考題，認識香港保衛戰及日佔時期歷史。完成答題可查看得分與解析，樹立正確歷史觀。</p>
        </div>

        <!-- 中文影片模組 -->
        <div class="video-wrap">
            <h3>🎬 9號館 中文介紹影片</h3>
            <div class="video-box">
                <!-- B站嵌入影片 BV1eFgQ6bESE -->
                <iframe 
                    src="https://player.bilibili.com/player.html?bvid=BV1eFgQ6bESE&autoplay=0&danmaku=0" 
                    frameborder="0" 
                    allowfullscreen
                    allow="encrypted-media">
                </iframe>
            </div>
            <p style="margin-top:10px;color:#666;font-size:14px;">建議看完影片再開始答題，加深歷史記憶</p>
        </div>

        <!-- 新增英文介紹影片 Google Drive -->
        <div class="video-wrap">
            <h3>🎬 9號館 English Introduction Video</h3>
            <div class="video-box">
                <iframe 
                    src="https://drive.google.com/file/d/1vvi6kdNAkOT2TSFFnn7xbg7MUhXK_vKF/preview" 
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
            </div>
            <p style="margin-top:10px;color:#666;font-size:14px;">English version introduction video of Exhibition Hall 9</p>
        </div>

        <div class="quiz-box">
            <div class="question-num" id="qNum">題目 1 / 8</div>
            <div class="question-title" id="question"></div>
            <ul class="options-list" id="options"></ul>
            <div class="tip-box" id="answerTip"></div>

            <div class="btn-group">
                <button id="nextBtn" disabled>下一題</button>
                <button id="resetBtn">重新答題</button>
            </div>

            <div class="score-panel">
                <h4>當前得分：<span id="score">0</span> / <span id="total">8</span></h4>
            </div>
        </div>

        <footer>
            香港歷史知識問答學習平台 · 尊重歷史，銘記發展歷程
        </footer>
    </div>

    <script>
        // 9號館更新後8道繁體題目
        const quizData = [
            {
                question: "1. 9 號館的核心主題是什麼:",
                options: ["A. 香港戰後重建發展","B. 日軍侵港歷史","C. 香港近代商貿發展","D. 港澳軍民聯合抗戰史"],
                answer: "B",
                explain: "原文明確指出 9 號館主題為日軍侵港，依托館藏史料還原香港保衛戰相關歷史。"
            },
            {
                question: "2. 9 號館整體敘事分為三大板塊，下列不屬於三大板塊的是:",
                options: ["A. 戰前備戰","B. 戰時攻防","C. 戰後復興","D. 戰俘苦難"],
                answer: "C",
                explain: "展館三大敘事板塊為戰前備戰、戰時攻防、戰俘苦難，無戰後復興板塊。"
            },
            {
                question: "3. 9 號館開篇展區的核心物證不包括以下哪一項:",
                options: ["A. 防空手搖警報器","B. 英軍防毒面具","C. 戰俘手寫家書","D. 1941 年市區機槍堡壘舊照"],
                answer: "C",
                explain: "戰俘手寫家書屬於展廳後半段淪陷戰俘展區展品，不屬於開篇戰前備戰展區物證。"
            },
            {
                question: "4. 開篇展區透過大佛口街頭機槍工事照片及防護器具，印證的歷史背景是:",
                options: ["A. 香港防務儲備不足，戰前倉促佈防","B. 香港守軍軍備充足、備戰充分","C. 日軍戰前長期駐紮香港","D. 香港市民提前疏散、遠離戰亂"],
                answer: "A",
                explain: "開篇展區展品與照片，直觀展現市民直面空襲威脅、英軍倉促佈防的局面，印證香港防務儲備不足的歷史背景。"
            },
            {
                question: "5. 展廳中段核心展區陳列的日軍戰地軍械是:",
                options: ["A. 六二式野戰電話","B. 九二式野戰電話","C. 八五式步槍","D. 九九式重機槍"],
                answer: "B",
                explain: "展廳中段陳列日軍九二式野戰電話、軍用步槍、鋼盔等戰地軍械。"
            },
            {
                question: "6. 9 號館重點還原的香港保衛戰持續時長為:",
                options: ["A. 十八天","B. 一個月","C. 三個月","D. 三年零八個月"],
                answer: "A",
                explain: "展館完整還原 1941 年十八天香港保衛戰全貌。"
            },
            {
                question: "7. 香港日佔時期的時長為:",
                options: ["A. 一年零八個月","B. 兩年零八個月","C. 三年零八個月","D. 五年零八個月"],
                answer: "C",
                explain: "香港日佔時期為三年零八個月，展廳後半段聚焦香港淪陷後戰俘苦難與戰爭創傷。"
            },
            {
                question: "8. 9 號館的核心敘事特點是:",
                options: ["A. 以抽象歷史文字為主，實物展品為輔","B. 全部依托館藏實物、照片、戰地遺存以物證史","C. 重點講述全國抗戰主流戰役，弱化香港史實","D. 僅記錄日軍作戰過程，無軍民抗爭內容"],
                answer: "B",
                explain: "整間展廳不依靠抽象文字敘事，全部以戰爭遺存、館藏實物、歷史照片為史料根基，以物證史。"
            }
        ];

        // 全域變數
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        // DOM元素
        const qNumEl = document.getElementById("qNum");
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const tipEl = document.getElementById("answerTip");
        const nextBtn = document.getElementById("nextBtn");
        const resetBtn = document.getElementById("resetBtn");
        const scoreEl = document.getElementById("score");
        const totalEl = document.getElementById("total");

        // 初始化總題目數量
        totalEl.textContent = quizData.length;

        // 渲染當前題目
        function renderQuiz(){
            answered = false;
            tipEl.style.display = "none";
            nextBtn.disabled = true;
            const item = quizData[currentIndex];
            qNumEl.textContent = `題目 ${currentIndex+1} / ${quizData.length}`;
            questionEl.textContent = item.question;
            optionsEl.innerHTML = "";

            // 生成選項列表
            item.options.forEach(opt => {
                const li = document.createElement("li");
                li.textContent = opt;
                li.addEventListener("click", ()=>selectOption(opt, li));
                optionsEl.appendChild(li);
            })
        }

        // 選擇答案邏輯
        function selectOption(selectOpt, liDom){
            if(answered) return;
            answered = true;
            nextBtn.disabled = false;
            const qItem = quizData[currentIndex];
            const selectKey = selectOpt.split(".")[0];

            // 遍歷所有選項，標記正確/錯誤
            const allLi = optionsEl.querySelectorAll("li");
            allLi.forEach(li=>{
                const key = li.textContent.split(".")[0];
                if(key === qItem.answer){
                    li.classList.add("option-correct");
                }else if(key === selectKey && key !== qItem.answer){
                    li.classList.add("option-wrong");
                }
                li.style.pointerEvents = "none";
            })

            // 計算得分+展示解析提示
            tipEl.style.display = "block";
            if(selectKey === qItem.answer){
                score++;
                scoreEl.textContent = score;
                tipEl.className = "tip-box tip-correct";
                tipEl.innerHTML = `<strong>回答正確！</strong><br>解析：${qItem.explain}`;
            }else{
                tipEl.className = "tip-box tip-wrong";
                tipEl.innerHTML = `<strong>回答錯誤</strong>，正確答案是 ${qItem.answer}<br>解析：${qItem.explain}`;
            }
        }

        // 下一題點擊事件
        nextBtn.addEventListener("click", ()=>{
            if(currentIndex < quizData.length - 1){
                currentIndex++;
                renderQuiz();
            }else{
                // 全部答完彈窗總結
                const fullScore = quizData.length;
                const rate = score / fullScore;
                let msg = "";
                if(rate >= 0.7){
                    msg = "展廳歷史知識掌握優秀！";
                }else{
                    msg = "建議重新觀看影片複習相關展廳歷史知識點";
                }
                alert(`答題完成！你的總分：${score} / ${fullScore}\n${msg}`);
            }
        })

        // 重置全部答題
        resetBtn.addEventListener("click", ()=>{
            currentIndex = 0;
            score = 0;
            scoreEl.textContent = 0;
            renderQuiz();
        })

        // 頁面載入完成渲染第一題
        window.onload = renderQuiz;
    </script>
</body>
</html>
